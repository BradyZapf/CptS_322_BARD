# Fails a pull request whose description does not link an issue with a closing keyword.
# Why: the board automation (project-board.yml) finds "the issue this PR is for" from
# "Closes #12" in the PR description. No keyword means the card never moves to Code Review.
# Docs-only or chore PRs with no issue can carry the `no-issue` label to skip the check.
name: PR links an issue

on:
  # pull_request (not pull_request_target) is fine here: we only read the PR text and
  # never use secrets. For PRs from forks GitHub runs it with read-only rights, which is safe.
  pull_request:
    # Re-check when the description is edited or a label is added/removed, so fixing the
    # description or adding `no-issue` turns the check green without a new commit.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

# Least privilege: this job only needs to read.
permissions:
  contents: read

jobs:
  closing-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Body has Closes/Fixes/Resolves #n
        # The PR text is passed in as environment variables, NOT pasted into the script.
        # Pasting user-written text into a shell script would let a PR description run commands.
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Wrap the labels in commas so "no-issue" matches only as a whole label.
          case ",$LABELS," in
            *,no-issue,*) echo "no-issue label set, skipping."; exit 0 ;;
          esac
          # The pattern (case-insensitive) means:
          #   a closing word: close / closes / closed, fix / fixes / fixed, resolve / resolves / resolved
          #   then a space or colon, then an issue reference: "#12" or "owner/repo#12"
          # So these pass: "Closes #12", "fixes: #3", "Resolved BradyZapf/CptS_322_BARD#4".
          # These fail: "Closes #" (no number), "see #5" (not a closing word).
          if printf '%s' "$BODY" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+(#|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#)[0-9]+'; then
            echo "Found a closing keyword."
          else
            # "::error::" makes GitHub show this line as a red error annotation.
            echo "::error::Add 'Closes #<issue number>' to the PR description (or label the PR no-issue)."
            exit 1
          fi
