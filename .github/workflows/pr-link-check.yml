name: PR links an issue

# The board automation finds a PR's issue through "Closes #n" in the PR body, so require it.
# Docs-only or chore PRs with no issue can carry the `no-issue` label to skip the check.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  closing-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Body has Closes/Fixes/Resolves #n
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          case ",$LABELS," in
            *,no-issue,*) echo "no-issue label set, skipping."; exit 0 ;;
          esac
          if printf '%s' "$BODY" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+(#|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#)[0-9]+'; then
            echo "Found a closing keyword."
          else
            echo "::error::Add 'Closes #<issue number>' to the PR description (or label the PR no-issue)."
            exit 1
          fi
