name: Project board

# Moves issues on the sprint board by themselves:
#   issue opened / reopened      -> To Do
#   issue assigned               -> In Progress
#   PR opened / ready / review requested -> every issue the PR closes -> Code Review
# "Done" is left to the board's built-in workflows (item closed, PR merged).
#
# Needs a repo secret PROJECT_TOKEN (see CONTRIBUTING.md). GITHUB_TOKEN cannot write a
# user-owned Projects v2 board. Without the secret the job prints a notice and passes.
#
# pull_request_target runs with secrets, so this file must NEVER check out or run PR code.
# It only reads the event data, which is why it is safe for pull requests from forks.

on:
  issues:
    types: [opened, reopened, assigned]
  pull_request_target:
    types: [opened, reopened, ready_for_review, review_requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  PROJECT_OWNER: BradyZapf   # user that owns the board
  PROJECT_NUMBER: 5          # the number in .../projects/5

jobs:
  move:
    runs-on: ubuntu-latest
    # A draft PR is not ready for review yet; ready_for_review fires when it is.
    if: github.event_name == 'issues' || github.event.pull_request.draft == false
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            if (!process.env.PROJECT_TOKEN) {
              core.notice('PROJECT_TOKEN secret is not set, so the board was not updated. See CONTRIBUTING.md.');
              return;
            }
            // The default `github` client uses GITHUB_TOKEN, which cannot write the board.
            const gh = getOctokit(process.env.PROJECT_TOKEN);

            // 1. Look up the project and its Status options by name (no hard-coded ids).
            const lookup = await gh.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`, { owner: process.env.PROJECT_OWNER, number: Number(process.env.PROJECT_NUMBER) });
            const project = lookup.user.projectV2;
            const status = project.field;
            const optionId = (name) => {
              const o = status.options.find((x) => x.name === name);
              if (!o) throw new Error(`Status option "${name}" not found on the board`);
              return o.id;
            };

            // 2. Work out which issues to move and where to.
            let issueIds = [];   // GraphQL node ids
            let target;          // Status name
            let onlyFrom;        // move only if the current Status is one of these (null = always)
            if (context.eventName === 'issues') {
              issueIds = [context.payload.issue.node_id];
              const action = context.payload.action;
              target = action === 'assigned' ? 'In Progress' : 'To Do';
              onlyFrom = action === 'assigned' ? ['', 'To Do'] : null;
            } else {
              const pr = await gh.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 20) { nodes { id number } }
                    }
                  }
                }`, { owner: context.repo.owner, repo: context.repo.repo, number: context.payload.pull_request.number });
              const issues = pr.repository.pullRequest.closingIssuesReferences.nodes;
              if (issues.length === 0) {
                core.notice('This PR closes no issue (no "Closes #n" in the body), nothing to move.');
                return;
              }
              issueIds = issues.map((i) => i.id);
              target = 'Code Review';
              onlyFrom = ['', 'To Do', 'In Progress'];   // never pull a card back from Testing/Done
            }

            // 3. Add each issue to the board (adding twice returns the same item) and set Status.
            for (const contentId of issueIds) {
              const added = await gh.graphql(`
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                    item {
                      id
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }`, { project: project.id, content: contentId });
              const item = added.addProjectV2ItemById.item;
              const current = item.fieldValueByName?.name ?? '';
              if (onlyFrom && !onlyFrom.includes(current)) {
                core.info(`Leaving ${contentId} in "${current}" (not moving it to ${target}).`);
                continue;
              }
              await gh.graphql(`
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: {singleSelectOptionId: $option}
                  }) { projectV2Item { id } }
                }`, { project: project.id, item: item.id, field: status.id, option: optionId(target) });
              core.info(`Moved ${contentId}: "${current}" -> "${target}"`);
            }
